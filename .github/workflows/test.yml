name: Github actions with IAM role

on:
  push:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          role-session-name: github-actions-federation
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Fetch instance IDs from TG
        id: fetch
        run: |
              echo "INSTANCE_IDS=$(aws elbv2 describe-target-health \
              --target-group-arn ${{ secrets.TG_ARN }} \
              --query 'TargetHealthDescriptions[*].Target.Id' \
              --output text)" >> $GITHUB_ENV
          
      - name: Deploy application via SSM
        run: |
          for instance in $INSTANCE_IDS; do echo "Deploying in $instance"; aws ssm send-command \
            --instance-ids $instance \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[ "echo \"Healthy from ASG - version 5\" > /var/www/html/index.html","systemctl restart httpd"]}'; done
